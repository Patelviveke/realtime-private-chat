
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vamora Private Messaging</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Vamora</h1>

  <form id="username-form" class="login-box">
    <h2>Welcome to Vamora</h2>
    <input type="text" id="name-input" placeholder="Enter your username" maxlength="20" required>
    <button type="submit">Join Chat</button>
  </form>

  <div id="chat-app" class="chat-app" hidden>
    <aside class="sidebar">
      <h2>Messages</h2>
      <p id="client-total">Online: 0</p>
      <div id="user-list"></div>
    </aside>

    <main class="chat-window">
      <header class="chat-header">
        <h2 id="active-user-name">Select a user</h2>
      </header>

      <ul id="message-container" class="message-container"></ul>

      <!-- Image preview -->
      <div id="image-preview-box" class="image-preview-box" hidden>
        <img id="image-preview" src="" alt="Selected image preview">
        <div class="image-preview-actions">
          <button type="button" id="cancel-image">Cancel</button>
          <button type="button" id="send-image">Send Image ➤</button>
        </div>
      </div>

      <!-- Reply preview -->
      <div id="reply-preview-box" class="reply-preview-box" hidden>
        <div class="reply-preview-content">
          <strong>Replying to <span id="reply-preview-name"></span></strong>
          <p id="reply-preview-text"></p>
        </div>
        <button type="button" id="cancel-reply" aria-label="Cancel reply">✕</button>
      </div>

      <!-- Message form -->
      <form id="message-form" class="message-form">
        <button type="button" id="image-button" class="image-button" disabled title="Share image">📎</button>

        <input
          type="file"
          id="image-input"
          accept="image/jpeg,image/png,image/gif,image/webp"
          hidden
        >

        <input
          type="text"
          id="message-input"
          class="message-input"
          placeholder="Select a user first..."
          autocomplete="off"
          disabled
        >

        <button type="submit" disabled>Send ➤</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
